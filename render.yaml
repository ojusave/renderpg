projects:
  - name: renderpg
    environments:
      - name: production
        envVarGroups:
          - name: renderpg-config
            envVars:
              - key: NODE_VERSION
                value: "24"
              - key: AI_MODE
                value: anthropic
              - key: ANTHROPIC_API_KEY
                sync: false
              - key: ANTHROPIC_MODEL
                sync: false
              - key: AI_TIMEOUT_MS
                value: "60000"
              - key: SCENARIO_PROVIDER
                value: anthropic
              - key: OPENROUTER_API_KEY
                sync: false
              - key: OPENROUTER_MODEL
                sync: false
              - key: OKTA_AUTH
                value: "on"
              - key: WORKFLOW_MODE
                value: render
              - key: WORKFLOW_TASK
                value: renderpg-workflows/compileAdventure
              - key: SCENARIO_TASK
                value: renderpg-workflows/fillScenario
              - key: REPLENISH_TASK
                value: renderpg-workflows/replenishScenarioPool
              - key: RENDER_API_KEY
                sync: false
        services:
          - type: web
            name: renderpg-api
            runtime: node
            region: oregon
            plan: starter
            buildCommand: npm ci && npm run build
            preDeployCommand: node --env-file-if-exists=.env dist/scripts/migrate.js
            startCommand: node --env-file-if-exists=.env dist/src/server.js
            healthCheckPath: /health
            autoDeployTrigger: commit
            envVars:
              - fromGroup: renderpg-config
              - key: DATABASE_URL
                fromDatabase:
                  name: renderpg-db
                  property: connectionString
              - key: SESSION_SECRET
                generateValue: true
          - type: cron
            name: renderpg-replenish
            runtime: node
            region: oregon
            plan: starter
            schedule: "*/15 * * * *"
            buildCommand: npm ci && npm run build
            startCommand: node --env-file-if-exists=.env dist/scripts/replenish.js
            envVars:
              - fromGroup: renderpg-config
              - key: DATABASE_URL
                fromDatabase:
                  name: renderpg-db
                  property: connectionString
              - key: SESSION_SECRET
                generateValue: true
          - type: cron
            name: renderpg-slack-sync
            runtime: node
            region: oregon
            plan: starter
            schedule: "0 * * * *"
            buildCommand: npm ci && npm run build
            startCommand: node --env-file-if-exists=.env dist/scripts/slack-sync.js
            envVars:
              - fromGroup: renderpg-config
              - key: DATABASE_URL
                fromDatabase:
                  name: renderpg-db
                  property: connectionString
              - key: SLACK_USER_TOKEN
                sync: false
              - key: SLACK_INGEST_ENABLED
                value: "true"
              - key: SLACK_WORKFLOW_MODE
                value: render
              - key: SLACK_SYNC_TASK
                value: renderpg-slack/syncSlack
          - type: workflow
            name: renderpg-slack
            runtime: node
            region: oregon
            buildCommand: npm ci && npm run build
            startCommand: node dist/workflows/slack/main.js
            envVars:
              - key: NODE_VERSION
                value: "24"
              - key: DATABASE_URL
                fromDatabase:
                  name: renderpg-db
                  property: connectionString
              - key: SLACK_USER_TOKEN
                sync: false
              - key: SLACK_INGEST_ENABLED
                value: "true"
          - type: workflow
            name: renderpg-workflows
            runtime: node
            region: oregon
            buildCommand: npm ci && npm run build
            startCommand: node dist/workflows/main.js
            envVars:
              - fromGroup: renderpg-config
              - key: DATABASE_URL
                fromDatabase:
                  name: renderpg-db
                  property: connectionString
        databases:
          - name: renderpg-db
            region: oregon
            plan: basic-256mb
            ipAllowList: []
