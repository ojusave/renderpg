previews:
  generation: automatic
  expireAfterDays: 3

envVarGroups:
  - name: renderpg-shared
    envVars:
      - key: AI_MODE
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: AI_TIMEOUT_MS
        value: 60000
      - key: WORKFLOW_MODE
        value: render
      - key: WORKFLOW_TASK
        sync: false
      - key: SCENARIO_TASK
        sync: false
      - key: RENDER_API_KEY
        sync: false

services:
  - type: web
    name: renderpg-api
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    previews:
      generation: automatic
    envVars:
      - fromGroup: renderpg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: renderpg-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
  - type: cron
    name: renderpg-replenish
    runtime: node
    region: oregon
    schedule: "*/15 * * * *"
    buildCommand: npm ci && npm run build
    startCommand: node dist/scripts/replenish.js
    envVars:
      - fromGroup: renderpg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: renderpg-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: renderpg-db
    region: oregon
    plan: basic-256mb
    previewPlan: basic-256mb
    ipAllowList: []
